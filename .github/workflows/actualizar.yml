# Junta los titulares cada hora y publica la web en GitHub Pages.
# No usa claves ni secretos: solo lee RSS públicos y publica con el permiso del propio repositorio.
name: Actualizar noticias

on:
  schedule:
    - cron: '17 * * * *'      # cada hora (minuto 17, hora UTC). GitHub puede demorar unos minutos.
  workflow_dispatch:           # botón "Run workflow" para actualizar a mano
  push:
    branches: [main]

permissions:
  contents: write              # solo para el "latido" mensual (ver abajo)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Preparar la web
        run: |
          mkdir -p _sitio
          cp -r index.html 404.html manifest.webmanifest assets data _sitio/
          touch _sitio/.nojekyll
      - name: Juntar titulares
        run: node scripts/actualizar.mjs _sitio/data/noticias.json
      - name: Latido mensual (evita que GitHub pause la tarea por inactividad)
        if: github.event_name == 'schedule'
        run: |
          ultimo=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - ultimo )) -gt $(( 40 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%MZ > .github/ultima-actividad.txt
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/ultima-actividad.txt
            git commit -m "Latido mensual de la actualización automática [skip ci]"
            git push
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _sitio
  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
